<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body data-bs-theme ="light">

    <div class="d-flex flex-column justify-content-center align-items-center mt-3">
        <h1>convertitore di valuta</h1>

        <div class="form-check form-switch mt-3">
            <input class="form-check-input" type="checkbox" role="switch" id="darkSwitch">
            <label class="form-check-label" for="flexSwitchCheck">Dark mode</label>
        </div>

        <div class="d-flex flex-column justify-content-center align-items-center mt-3 p-3">
            <h2>Euro</h2>
            <img class="w-25 " src="images/euro.webp" alt="euro">
            <input id="euroInput" class="mt-2" type="text">
            <div id="valoreNonValido" class="alert alert-danger mt-2 d-none">
                <p class="mb-0">Valore non valido</p>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="d-flex flex-column justify-content-center align-items-center mt-3 p-3">
                <h2>Dollaro americano</h2>
                <img class="w-25" src="images/bandiera_stati_uniti.webp" alt="euro">
                <p id="valoreDollaro">0.00</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="d-flex flex-column justify-content-center align-items-center mt-3 p-3">
                <h2>Sterlina</h2>
                <img class="w-25" src="images/sterlina.webp" alt="sterlina">
                <p id="valoreSterlina">0.00</p>
            </div>
        <div class="col-md-4">
            <div class="d-flex flex-column justify-content-center align-items-center mt-3 p-3">
                <h2>Yen</h2>
                <img class="w-25 border border-black" src="images/giappone.webp" alt="euro">
                <p id="valoreYen">0.00</p>
            </div>
        </div>
        </div>
    </div>


    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
